# Default parameter file for Biogeme 3.3.5
# Automatically created on October 09, 2026. 23:40:25

[Estimation]
bootstrap_samples = 100 # int: number of re-estimations for bootstrap sampling.
calculating_second_derivatives = "analytical" # Defines how to calculate the second
                                              # derivatives:
                                              # analytical,finite_differences,never.
                                              #
analytical_hessian_mode = "full" # Implementation of the analytical Hessian: full,
                                 # chunked, or automatic. The compatibility
                                 # default is full.
hessian_parameter_block_size = 4 # Number of parameter directions evaluated
                                 # simultaneously by the chunked analytical
                                 # Hessian.
hessian_observation_batch_size = 100 # Number of observations evaluated
                                     # simultaneously by the chunked analytical
                                     # Hessian.
hessian_memory_fraction = 0.25 # Maximum fraction of effective process memory
                               # allocated to analytical Hessian intermediates.
                               # Resource-manager limits, such as a Slurm memory
                               # allocation, are honored when available.
large_data_set = 100000 # If the number of observations is larger than this
                        # value, the data set is deemed large, and the default
                        # estimation algorithm will not use second derivatives.
max_number_parameters_to_report = 15 # int: maximum number of parameters to
                                     # report during the estimation.
save_iterations = "True" # bool: If True, the current iterate is saved after each
                         # iteration, in a file named ``__[modelName].iter``,
                         # where ``[modelName]`` is the name given to the model.
                         # If such a file exists, the starting values for the
                         # estimation are replaced by the values saved in the
                         # file.
maximum_number_catalog_expressions = 100 # If the expression contains catalogs,
                                         # the parameter sets an upper bound of
                                         # the total number of possible
                                         # combinations that can be estimated in
                                         # the same loop.
optimization_algorithm = "automatic" # str: optimization algorithm to be used for
                                     # estimation. Valid values: ['automatic',
                                     # 'scipy', 'LS-newton', 'TR-newton',
                                     # 'LS-BFGS', 'TR-BFGS', 'simple_bounds',
                                     # 'simple_bounds_newton',
                                     # 'simple_bounds_BFGS']

[MultiThreading]
number_of_threads = 0 # int: Number of threads/processors to be used. If the
                      # parameter is 0, the number of available threads is
                      # calculated using cpu_count().

[AssistedSpecification]
maximum_number_parameters = 50 # int: maximum number of parameters allowed in a
                               # model. Each specification with a higher number
                               # is deemed invalid and not estimated.
number_of_neighbors = 20 # int: maximum number of neighbors that are visited by
                         # the VNS algorithm.
largest_neighborhood = 20 # int: size of the largest neighborhood considered by
                          # the Variable Neighborhood Search (VNS) algorithm.
maximum_attempts = 100 # int: an attempts consists in selecting a solution in the
                       # Pareto set, and trying to improve it. The parameter
                       # imposes an upper bound on the total number of attempts,
                       # irrespectively if they are successful or not.

[TrustRegion]
dogleg = "True" # bool: choice of the method to solve the trust region subproblem.
                # True: dogleg. False: truncated conjugate gradient.

[Bootstrap]
number_of_jobs = 2 # int: The maximum number of concurrently running jobs. If -1
                   # is given, joblib tries to use all CPUs.

[Bayesian]
mcmc_sampling_strategy = "automatic" # Defines how MCMC sampling is performed:
                                     # 'automatic' (selected based on hardware),
                                     # 'numpyro-parallel' (one chain per device),
                                     # 'numpyro-vectorized' (all chains on one
                                     # device), 'pymc' (default PyMC sampler on
                                     # CPU)
sample_from_prior = "True" # bool: if "True", samples from the prior distributions
                           # are generated. This may help in the diagnostic of
                           # indentification issues.
bayesian_draws = 2000 # Number of draws per chain from the posterior distribution
warmup = 2000 # Number of warm-up / burn-in iterations per chain that are used
              # only to adapt the sampler, not to estimate the posterior.
chains = 4 # Number of independent Markov chains to run in parallel.
target_accept = 0.9 # Target acceptance probability for the No-U-Turn Sampler
                    # (NUTS) algorithm. Higher values like 0.9 or 0.95 often work
                    # better for problematic posteriors.
calculate_waic = "False" # Calculates the Widely Applicable Information Criterion
                         # (WAIC)
calculate_loo = "True" # Calculates the Leave-One-Out Cross-Validation (LOO)
calculate_likelihood = "True" # Calculates likelihood-based statistics from the
                              # posterior draws

[SimpleBounds]
second_derivatives = 1.0 # float: proportion (between 0 and 1) of iterations when
                         # the analytical Hessian is calculated
tolerance = 6.055454452393343e-06 # float: the algorithm stops when this
                                  # precision is reached
max_iterations = 1000 # int: maximum number of iterations
infeasible_cg = "False" # If True, the conjugate gradient algorithm may generate
                        # infeasible solutions until termination.  The result
                        # will then be projected on the feasible domain.  If
                        # False, the algorithm stops as soon as an infeasible
                        # iterate is generated
initial_radius = 1 # Initial radius of the trust region
steptol = 3.666852862501036e-11 # The algorithm stops when the relative change in
                                # x is below this threshold. Basically, if p
                                # significant digits of x are needed, steptol
                                # should be set to 1.0e-p.
enlarging_factor = 10 # If an iteration is very successful, the radius of the
                      # trust region is multiplied by this factor

[Biogeme]
version = "3.3.5" # Version of Biogeme that created the TOML file. Do not modify
                  # this value.

[MonteCarlo]
number_of_draws = 10000 # int: Number of draws for Monte-Carlo integration.
monte_carlo_diagnostic_auto = "False" # Run the post-estimation Monte Carlo
                                      # draw-stability diagnostic automatically
                                      # after estimate_or_load. Disabled by
                                      # default.
monte_carlo_diagnostic_draw_factors = "0.25,0.5,1.0,2.0,4.0" # Comma-separated
                                                             # factors applied to
                                                             # the estimation
                                                             # draw count for the
                                                             # post-estimation
                                                             # stability
                                                             # diagnostic.
monte_carlo_diagnostic_replications = 2 # Number of independent diagnostic draw
                                        # designs per level.
monte_carlo_diagnostic_time_budget = 1800 # Hard wall-clock budget in seconds for
                                          # the draw-stability diagnostic.
monte_carlo_diagnostic_max_draws = 1000000 # Maximum number of draws in one
                                           # diagnostic evaluation.
monte_carlo_diagnostic_safety_factor = 1.5 # Safety multiplier applied to the
                                           # forecast runtime of pending
                                           # diagnostic evaluations.
monte_carlo_diagnostic_objective_tolerance = 0.001 # Maximum absolute objective
                                                   # discrepancy considered
                                                   # stable by the Monte Carlo
                                                   # diagnostic.
monte_carlo_diagnostic_gradient_tolerance = 1e-05 # Maximum infinity norm of the
                                                  # gradient discrepancy
                                                  # considered stable by the
                                                  # Monte Carlo diagnostic.
monte_carlo_diagnostic_minimum_level_factor = 2.0 # Minimum draw-count factor
                                                  # above the original count
                                                  # required for a conclusive
                                                  # stability result.
seed = 0 # int: Seed used for the pseudo-random number generation. It is useful
         # only when each run should generate the exact same result. If 0, a new
         # seed is used at each run.

[Output]
identification_threshold = 1e-05 # float: if the smallest eigenvalue of the
                                 # second derivative matrix is lesser or equal to
                                 # this parameter, the model is considered not
                                 # identified. The corresponding eigenvector is
                                 # then reported to identify the parameters
                                 # involved in the issue.
only_robust_stats = "True" # bool: "True" if only the robust statistics need to be
                           # reported. If "False", the statistics from the
                           # Rao-Cramer bound are also reported.
generate_html = "True" # bool: "True" if the HTML file with the results must be
                       # generated.
generate_yaml = "True" # bool: "True" if the yaml file with the results must be
                       # generated.
generate_netcdf = "True" # bool: "True" if the netcdf file with the Bayesian
                         # estimation results must be generated.
save_validation_results = "True" # bool: "True" if the validation results are saved
                                 # in CSV files.

[Specification]
missing_data = 99999 # number: If one variable has this value, it is assumed that
                     # a data is missing and an exception will be triggered.
numerically_safe = "False" # If true, Biogeme prioritizes numerical stability over
                           # speed. Likelihood expressions use finite masks for
                           # unavailable alternatives and empty nests so that
                           # values and automatic derivatives remain finite.
use_jit = "True" # If True, the model is compiled using jit (just-in-time) to speed
                 # up the calculation. For complex models, compilation time may
                 # exceed the gain due to compilation, so that it is worth
                 # turning it off.

